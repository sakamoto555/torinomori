<!DOCTYPE html>
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>いのだの森</title>

<link href="style.css" rel="stylesheet"/></head>
<body data-theme="day">
<main class="site">
<header class="header">
<div class="logo">
<div class="logo-mark"></div>
<div>伊野田の森</div>
</div>
<nav aria-label="森の時間帯を切り替える" class="theme-switcher">
<button class="theme-button active" data-theme-value="day" type="button">昼の森</button>
<button class="theme-button" data-theme-value="evening" type="button">夕方の森</button>
<button class="theme-button" data-theme-value="night" type="button">夜の森</button>
</nav>
<a class="release-link" href="#" onclick="alert('投稿ページは次の段階で作成します'); return false;">森に離す</a>
</header>
<section aria-label="森を流れる生き物の投稿" class="forest-stream" id="forestStream"></section>
<section class="intro">
<small>MEET A CREATURE BY CHANCE</small>
<h1>伊野田の森</h1>
<p>
        誰かが放した一枚と出会う場所。<br/>
        流れていく気配を追いかけましょう。
      </p>
<button class="encounter-button" id="encounterButton">生き物と出会う</button>
<button class="release-button" id="releaseButton">生き物を放す</button>

</section>
<div class="footer-note">
      この森は、みんなの投稿によって少しずつ育っていきます。
    </div>
</main>
<aside aria-hidden="true" class="detail" id="detail">
<div aria-labelledby="birdName" aria-modal="true" class="detail-panel" role="dialog">
<div class="detail-image" id="detailImage"></div>
<div class="detail-copy">
<button aria-label="閉じる" class="close-button" id="closeButton">×</button>
<div class="detail-kicker">AN ENCOUNTER IN THE FOREST</div>
<h2 id="birdName">リュウキュウアカショウビン</h2>
<dl>
<dt>投稿者</dt><dd id="author"></dd>
<dt>場所</dt><dd id="location"></dd>
<dt>日付</dt><dd id="date"></dd>
<dt>種類</dt><dd id="species"></dd>
</dl>
<p class="detail-comment" id="comment"></p>
</div>
</div>
</aside>

<script defer="" src="script.js"></script></body>
</html>
